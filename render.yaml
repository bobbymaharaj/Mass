services:
  - type: web
    name: telegram-report-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SUPER_ADMIN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
